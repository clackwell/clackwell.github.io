<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bookmarklet and Link Demo</title>
</head>
<body>
  <h1>Bookmarklet &amp; Link Demo</h1>

  <!-- Bookmarklet: Drag this link to your bookmarks bar -->
  <p>
    1. Drag this bookmarklet to your bookmarks bar:
    <a href="javascript:(function(){ alert('Hello! Bookmarklet executed successfully.'); })();">
      Show Alert Bookmarklet
    </a>
  </p>

  <!-- Standard Link -->
  <p>
    2. Visit Microsoft:
    <a href="https://www.microsoft.com" target="_blank" rel="noopener noreferrer">
      Go to www.microsoft.com
    </a>
  </p>
</body>
</html>
